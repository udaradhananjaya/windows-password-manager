name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = ([xml](Get-Content HelloAutofill.csproj)).Project.PropertyGroup.Version
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $tag -cne "v$version") {
            throw "Tag $tag must match the project version v$version."
          }
      - name: Publish standalone executable
        shell: pwsh
        run: |
          dotnet publish HelloAutofill.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash release/HelloAutofill.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$pwd/release/SHA256SUMS.txt", "$hash  HelloAutofill.exe`n")
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME release/HelloAutofill.exe release/SHA256SUMS.txt --draft --verify-tag --title "Hello Autofill $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
